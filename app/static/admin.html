<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rentora — Operations</title>
<!-- installable app (home screen + push notifications) -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rentora">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root{
    --ink:#0c1f2c; --deep:#0a3047; --teal:#0f6a7d; --aqua:#21a7b8;
    --sand:#f4efe6; --paper:#fbf8f2; --line:#dfd6c6; --good:#1f7a53;
    --warn:#b8541f; --bad:#a32626; --mut:#6b7d86;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);
    background-image:radial-gradient(circle at 1px 1px, rgba(12,31,44,.05) 1px, transparent 0);
    background-size:22px 22px;min-height:100vh}
  .mono{font-family:'IBM Plex Mono',monospace}
  /* Login */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--deep),var(--ink));z-index:50}
  #login .card{background:var(--paper);padding:42px;width:360px;border-radius:4px;
    box-shadow:0 30px 80px rgba(0,0,0,.4)}
  #login h1{font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin-bottom:4px}
  #login p{color:var(--mut);font-size:13px;margin-bottom:26px}
  input,select{width:100%;padding:11px 13px;border:1px solid var(--line);background:#fff;
    border-radius:3px;font-family:inherit;font-size:14px;margin-bottom:12px}
  input:focus,select:focus{outline:none;border-color:var(--teal)}
  button{cursor:pointer;border:none;font-family:inherit;font-weight:600}
  .btn{background:var(--deep);color:var(--sand);padding:11px 18px;border-radius:3px;font-size:14px;
    transition:.15s}
  .btn:hover{background:var(--teal)}
  .btn-sm{padding:6px 12px;font-size:12px}
  .btn-ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
  /* Layout */
  .shell{display:none;grid-template-columns:228px 1fr;min-height:100vh}
  aside{background:var(--ink);color:var(--sand);padding:26px 18px;position:sticky;top:0;
    height:100vh;align-self:start;display:flex;flex-direction:column;
    overflow:hidden;box-sizing:border-box}
  .brand{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1.1;margin-bottom:2px}
  .brand small{display:block;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:2px;
    color:var(--aqua);margin-top:6px;text-transform:uppercase}
  /* sidebar scrolls on its own so the last items never fall outside the dark panel */
  .brand{flex-shrink:0}
  nav{margin-top:26px;display:flex;flex-direction:column;gap:1px;
    overflow-y:auto;flex:1;min-height:0;padding-bottom:16px;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
  nav::-webkit-scrollbar{width:6px}
  nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}

  /* sticky save bar so the button is always reachable on long forms */
  .save-bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
    padding:14px 0;margin-top:18px;display:flex;align-items:center;gap:14px;z-index:5}
  /* group heading doubles as a collapse toggle */
  .nav-sec{color:#5f7480;font-size:10px;font-weight:700;letter-spacing:1.4px;
    text-transform:uppercase;padding:15px 13px 6px;margin-top:5px;
    border-top:1px solid rgba(255,255,255,.07);
    background:none;border-left:none;border-right:none;border-bottom:none;
    width:100%;text-align:left;cursor:pointer;display:flex;
    align-items:center;justify-content:space-between;transition:.12s}
  .nav-sec:hover{color:#9db0ba}
  .nav-sec .caret{font-size:9px;opacity:.7}
  .nav-grp{display:flex;flex-direction:column;gap:1px}
  .nav-grp[hidden]{display:none}   /* [hidden] alone loses to display:flex */
  .nav-sec:first-child{border-top:none;margin-top:0}
  nav a{color:#b7c4cb;text-decoration:none;padding:9px 13px;border-radius:6px;font-size:14px;
    display:flex;align-items:center;gap:10px;transition:.12s;cursor:pointer;
    position:relative}
  nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  nav a.active{background:var(--teal);color:#fff;font-weight:600}
  nav a.active .dot{opacity:1;background:var(--gold)}
  nav a .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45;
    flex-shrink:0;transition:.12s}
  /* live counter badge (e.g. how many bookings today) */
  nav a .badge{margin-left:auto;background:var(--gold);color:#0f2230;font-size:10px;
    font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;
    place-items:center;padding:0 5px}
  nav a.active .badge{background:#fff}
  main{padding:32px 38px;overflow:auto;max-height:100vh}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px}
  header.top h2{font-family:'Fraunces',serif;font-size:30px;font-weight:600}
  header.top .sub{color:var(--mut);font-size:13px;margin-top:3px}
  .logout{font-size:12px;color:var(--mut);cursor:pointer}
  /* Cards */
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .stat{background:#fff;border:1px solid var(--line);border-radius:4px;padding:20px 22px;
    position:relative;overflow:hidden}
  .stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--aqua)}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut)}
  .stat .v{font-family:'Fraunces',serif;font-size:34px;font-weight:600;margin-top:6px}
  .stat .v small{font-size:15px;color:var(--mut)}
  .panel{background:#fff;border:1px solid var(--line);border-radius:4px;padding:22px}
  /* wide tables (bookings) scroll inside the panel instead of spilling out */
  .panel-scroll{overflow-x:auto}
  .panel h3{font-family:'Fraunces',serif;font-size:18px;margin-bottom:14px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);
    padding:8px 10px;border-bottom:2px solid var(--line)}
  td{padding:10px;border-bottom:1px solid #efe9dd}
  tr:hover td{background:var(--sand)}
  .tag{font-family:'IBM Plex Mono';font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
  .t-pending{background:#fff3e0;color:var(--warn)}
  .t-confirmed{background:#e3f3ec;color:var(--good)}
  .t-cancelled{background:#fbe6e6;color:var(--bad)}
  .t-completed{background:#e6eef3;color:var(--deep)}
  .pill{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:1px;
    padding:2px 8px;border:1px solid var(--line);border-radius:20px;color:var(--mut);text-transform:uppercase}
  .row-actions{display:flex;gap:5px;flex-wrap:wrap;min-width:190px;max-width:230px}
  .row-actions .btn{white-space:nowrap}
  .toolbar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
  .toolbar input,.toolbar select{width:auto;margin:0;min-width:120px}
  .empty{color:var(--mut);font-size:13px;padding:24px;text-align:center}
  .badge-live{font-size:11px;color:var(--good)}
  .badge-off{font-size:11px;color:var(--mut)}
  .modal-bg{position:fixed;inset:0;background:rgba(10,20,28,.55);display:none;
    align-items:center;justify-content:center;z-index:40}
  .modal{background:var(--paper);padding:30px;border-radius:5px;width:460px;max-height:88vh;overflow:auto}
  .modal h3{font-family:'Fraunces',serif;font-size:21px;margin-bottom:16px}
  .modal label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px;margin-top:8px}
  .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
  .convo{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .msg{padding:9px 13px;border-radius:9px;font-size:13px;max-width:78%}
  .msg.inbound{background:var(--sand);align-self:flex-start}
  .msg.outbound{background:var(--deep);color:var(--sand);align-self:flex-end}
  .msg .meta{font-size:9px;opacity:.6;margin-top:3px;text-transform:uppercase;letter-spacing:1px}
  /* ---------- Mobile (phone) ---------- */
  .mobile-bar{display:none}
  @media (max-width: 820px){
    /* top bar with hamburger replaces the fixed sidebar */
    .mobile-bar{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--sand);
      padding:12px 14px;position:sticky;top:0;z-index:40}
    .mobile-bar .mb-title{font-family:'Fraunces',serif;font-size:17px;font-weight:700;flex:1;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mb-burger{background:none;color:var(--sand);font-size:24px;line-height:1;padding:4px 6px}

    .shell{grid-template-columns:1fr}
    aside{position:fixed;top:0;left:0;bottom:0;width:260px;height:100vh;z-index:50;
      transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto;
      box-shadow:2px 0 20px rgba(0,0,0,.25)}
    body.nav-open aside{transform:translateX(0)}
    body.nav-open::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
    nav a{padding:13px 14px;font-size:15px}   /* touch-sized */

    main{padding:16px 14px;max-height:none}
    header.top{display:none}          /* mobile bar already shows the page name */

    .panel{padding:14px;border-radius:8px}
    .grid.g3,.grid.g2{grid-template-columns:1fr}

    /* booking cards: single column, money row stays 3-up but tighter */
    .bk{padding:13px 14px;border-radius:11px}
    .bk-money{gap:6px;grid-template-columns:repeat(3,minmax(0,1fr))}
    .bk-m{padding:7px 8px}
    .bk-m span{font-size:9.5px}
    .bk-m b{font-size:13.5px}
    .bk-name{font-size:14.5px}

    /* other tables become stacked cards — no sideways scrolling */
    table,thead,tbody,th,td,tr{display:block}
    thead{position:absolute;left:-9999px}       /* hide header row */
    tr{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;
      background:#fff}
    tr:hover td{background:transparent}
    td{border:none;padding:5px 0;display:flex;justify-content:space-between;gap:14px;
      align-items:flex-start;text-align:right}
    td::before{content:attr(data-l);color:var(--mut);font-size:11px;text-transform:uppercase;
      letter-spacing:.5px;text-align:left;flex-shrink:0}
    td:empty{display:none}
    .row-actions{max-width:none;min-width:0;justify-content:flex-start;padding-top:10px;
      border-top:1px solid var(--line);margin-top:6px}
    .row-actions::before{content:''}
    .row-actions .btn{flex:1;min-width:calc(50% - 3px);text-align:center;padding:10px 8px;font-size:13px}

    /* modals fill the screen on a phone */
    .modal{width:100%;max-width:100%;border-radius:14px 14px 0 0;padding:20px 16px;
      max-height:92vh;margin-top:auto}
    #modalbg{align-items:flex-end}
    input,select,textarea{font-size:16px}  /* stops iOS zoom-on-focus */
    .btn{padding:12px 16px}
    .toolbar{gap:8px}
  }
  /* ---------- Booking cards ---------- */
  .bk-list{display:grid;gap:12px}
  .bk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    cursor:pointer;transition:.15s;overflow:hidden}
  .bk:hover{border-color:var(--teal);box-shadow:0 2px 12px rgba(16,40,56,.07)}
  .bk-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .bk-who{min-width:0;flex:1}
  .bk-name{font-weight:700;font-size:15px;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bk-sub{color:var(--mut);font-size:12.5px;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bk-when{text-align:right;flex-shrink:0}
  .bk-date{font-weight:700;font-size:14px;white-space:nowrap}
  .bk-time{color:var(--mut);font-size:12.5px;font-family:'IBM Plex Mono'}

  .bk-money{display:grid;grid-template-columns:repeat(3,minmax(0,150px));gap:8px;margin:12px 0 10px}
  .bk-m{background:var(--sand);border-radius:8px;padding:8px 10px;min-width:0}
  .bk-m span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--mut);margin-bottom:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bk-m b{font-size:15px;font-variant-numeric:tabular-nums;display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bk-m.due{background:#fff5e0}
  .bk-m.due b{color:#b06f00}
  .bk-m.ok{background:#e8f5ee}
  .bk-m.ok b{color:var(--good)}

  .bk-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
  .bk-tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
  .bk-acts{display:flex;gap:6px;flex-shrink:0}
  .bk-acts .ic{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--teal);font-size:15px;display:grid;place-items:center;
    text-decoration:none;cursor:pointer;transition:.12s;padding:0}
  .bk-acts .ic:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* ---------- Booking detail rows ---------- */
  .det-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .det-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;
    border-bottom:1px solid var(--line)}
  .det-k{color:var(--mut);font-size:12px;flex-shrink:0}
  .det-v{font-size:13px;text-align:right;min-width:0;overflow-wrap:anywhere}
  /* long values (meeting instructions) get their own line, left aligned */
  .det-row.long{flex-direction:column;gap:3px}
  .det-row.long .det-v{text-align:left;line-height:1.45}
  @media (max-width: 820px){
    .det-grid{grid-template-columns:1fr;gap:10px}
  }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Rental OS</h1>
    <p>Operations console · sign in</p>
    <input id="lu" placeholder="username" value="admin" autocomplete="username">
    <input id="lp" type="password" placeholder="password" value="admin123" autocomplete="current-password">
    <button class="btn" style="width:100%" onclick="login()">Sign in</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div class="shell" id="shell">
  <aside>
    <div class="brand">Rental OS<small>Source of Truth</small></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="mobile-bar">
      <button class="mb-burger" onclick="toggleNav()" aria-label="Izbornik">☰</button>
      <div class="mb-title" id="mtitle">Dashboard</div>
      <div class="logout" style="color:var(--aqua)" onclick="logout()">↪</div>
    </div>
    <header class="top">
      <div><h2 id="ptitle">Dashboard</h2><div class="sub" id="psub"></div></div>
      <div class="logout" onclick="logout()">↪ Sign out</div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>

<script src="/static/app.js"></script>
</body>
</html>
